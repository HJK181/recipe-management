<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keil Automation - Recipe Editor</title>
    
    <!-- Tailwind CSS (CDN für Zero-Build Setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel für In-Browser JSX Kompilierung -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [jsonData, setJsonData] = useState(null);
            const [fileName, setFileName] = useState("modified_recipe.json");
            const [valuesOnly, setValuesOnly] = useState(false);

            // URL-Parameter parsen (vo=true)
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('vo') === 'true') {
                    setValuesOnly(true);
                }
            }, []);

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                setFileName(file.name);
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        setJsonData(parsed);
                    } catch (error) {
                        alert("Kritischer Fehler: Die hochgeladene Datei ist kein valides JSON.");
                    }
                };
                reader.readAsText(file);
            };

            const handleValueChange = (station, schreiber, key, newValue) => {
                setJsonData(prev => {
                    // Deep Clone zur Wahrung der Immutability
                    const newData = JSON.parse(JSON.stringify(prev));
                    const originalValue = newData.commands[0].writeValue[station][schreiber].values[key];
                    
                    // Typensicheres Mapping (verhindert dass aus Number -> String wird beim Speichern)
                    if (typeof originalValue === 'number') {
                        newData.commands[0].writeValue[station][schreiber].values[key] = newValue === '' ? '' : Number(newValue);
                    } else if (typeof originalValue === 'boolean') {
                        newData.commands[0].writeValue[station][schreiber].values[key] = newValue === 'true';
                    } else {
                        newData.commands[0].writeValue[station][schreiber].values[key] = newValue;
                    }
                    
                    return newData;
                });
            };

            const handleDownload = () => {
                if (!jsonData) return;
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(jsonData, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", fileName);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            // Flacht die verschachtelte JSON-Struktur in saubere Tabellenzeilen ab
            const extractRows = () => {
                if (!jsonData || !jsonData.commands || !jsonData.commands[0]?.writeValue) return [];
                const writeValue = jsonData.commands[0].writeValue;
                const rows = [];
                
                Object.keys(writeValue).forEach(station => {
                    Object.keys(writeValue[station]).forEach(schreiber => {
                        const values = writeValue[station][schreiber].values;
                        Object.keys(values).forEach(key => {
                            rows.push({
                                station,
                                schreiber,
                                key,
                                value: values[key],
                                type: typeof values[key]
                            });
                        });
                    });
                });
                return rows;
            };

            // Memoization für Performance bei Tastenanschlägen im Input
            const rows = useMemo(() => extractRows(), [jsonData]);
            const metaData = jsonData?.commands?.[0] || {};

            return (
                <div className="max-w-7xl mx-auto p-6">
                    {/* Header */}
                    <header className="flex justify-between items-center mb-8 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-800 tracking-tight">Recipe Editor</h1>
                            <p className="text-sm text-slate-500 font-mono mt-1">TcHmiRecipeManagement Parser</p>
                        </div>
                        {/* Firmen-Logo mit Fallback bei 404 (Ausblenden) */}
                        <img 
                            src="https://keil-automation.de/.cm4all/mediadb/Logos/logo.svg" 
                            alt="Keil Automation Logo" 
                            className="h-12 md:h-16 w-auto object-contain drop-shadow-sm"
                            onError={(e) => { e.target.style.display = 'none'; }}
                        />
                    </header>

                    {/* Toolbar */}
                    <div className="flex gap-4 mb-8 bg-white p-5 rounded-xl shadow-sm border border-slate-200 items-center justify-between">
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-2">Rezept-Datei (.json) laden</label>
                            <input 
                                type="file" 
                                accept=".json" 
                                onChange={handleFileUpload}
                                className="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer transition-colors"
                            />
                        </div>
                        {jsonData && (
                            <button 
                                onClick={handleDownload}
                                className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-md font-semibold transition-colors shadow-sm flex items-center gap-2"
                            >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Änderungen als JSON speichern
                            </button>
                        )}
                    </div>

                    {/* Empty State */}
                    {!jsonData && (
                        <div className="text-center py-24 text-slate-400 bg-white rounded-xl border-2 border-dashed border-slate-200">
                            <svg className="mx-auto h-12 w-12 text-slate-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <p className="text-lg">Bitte lade eine gültige Recipe-JSON hoch, um die Bearbeitung zu starten.</p>
                        </div>
                    )}

                    {/* Data View */}
                    {jsonData && (
                        <div className="space-y-6">
                            {/* Metadaten (Sichtbar wenn vo != true) */}
                            {!valuesOnly && (
                                <div className="bg-slate-800 rounded-xl p-5 shadow-sm overflow-x-auto text-sm text-green-400 font-mono">
                                    <div className="mb-3 text-slate-400 border-b border-slate-700 pb-2 uppercase tracking-wider text-xs font-bold">
                                        Recipe Metadaten (Read-Only) — Ansicht anpassbar via Parameter ?vo=true
                                    </div>
                                    <div className="py-1"><span className="text-pink-400 mr-2">requestType:</span>"{jsonData.requestType}"</div>
                                    <div className="py-1"><span className="text-pink-400 mr-2">symbol:</span>"{metaData.symbol}"</div>
                                    <div className="py-1"><span className="text-pink-400 mr-2">commandOptions:</span>{JSON.stringify(metaData.commandOptions)}</div>
                                </div>
                            )}

                            {/* Edit Table */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="overflow-x-auto max-h-[70vh] overflow-y-auto">
                                    <table className="w-full text-left border-collapse whitespace-nowrap">
                                        <thead className="sticky top-0 bg-slate-50 z-10 shadow-sm border-b border-slate-200">
                                            <tr className="text-slate-600 text-xs uppercase tracking-wider font-bold">
                                                <th className="p-4 w-1/6">Station</th>
                                                <th className="p-4 w-1/6">Schreiber</th>
                                                <th className="p-4 w-1/3">Property Name</th>
                                                <th className="p-4 w-1/3">Value (Editierbar)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {rows.map((row, idx) => (
                                                <tr key={`${row.station}-${row.schreiber}-${row.key}-${idx}`} className="hover:bg-blue-50/50 transition-colors">
                                                    <td className="p-4 text-sm text-slate-600">{row.station}</td>
                                                    <td className="p-4 text-sm text-slate-600">{row.schreiber}</td>
                                                    <td className="p-4 text-sm text-slate-900 font-mono font-medium">{row.key}</td>
                                                    <td className="p-4 text-sm">
                                                        {row.type === 'number' ? (
                                                            <input 
                                                                type="number" 
                                                                value={row.value}
                                                                onChange={(e) => handleValueChange(row.station, row.schreiber, row.key, e.target.value)}
                                                                className="w-full max-w-xs border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all shadow-sm font-mono text-blue-700"
                                                            />
                                                        ) : row.type === 'boolean' ? (
                                                             <select 
                                                                value={row.value.toString()}
                                                                onChange={(e) => handleValueChange(row.station, row.schreiber, row.key, e.target.value)}
                                                                className="w-full max-w-xs border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none bg-white shadow-sm font-mono text-blue-700"
                                                             >
                                                                <option value="true">true</option>
                                                                <option value="false">false</option>
                                                             </select>
                                                        ) : (
                                                            <input 
                                                                type="text" 
                                                                value={row.value}
                                                                onChange={(e) => handleValueChange(row.station, row.schreiber, row.key, e.target.value)}
                                                                className="w-full max-w-xs border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all shadow-sm bg-slate-50 font-mono text-slate-700"
                                                            />
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
